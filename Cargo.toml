[package]
name = "sorob-inspect"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Inspect Soroban WASM artifacts: structure, imports/exports, custom sections, and contract-spec validation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bomniop/sorob-inspect"
readme = "README.md"
keywords = ["stellar", "soroban", "wasm", "inspector", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmparser = "0.121"
stellar-xdr = { version = "28.0.1", features = ["alloc", "std"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "sorob-inspect"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
