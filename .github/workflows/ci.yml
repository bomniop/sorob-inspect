name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test --locked
        run: cargo test --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: cargo clippy --all-targets --all-features -- -D warnings
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Verifies the crate still builds with the declared MSRV (rust-version =
  # 1.85 in Cargo.toml). Uses the committed lockfile. Catches accidental
  # MSRV bumps from new dependencies or language features.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - name: cargo check --locked
        run: cargo check --locked

  # Verifies committed fixtures still decode correctly against the pinned
  # stellar-xdr version. Full contract rebuild requires stellar-cli 28.1.0
  # (too heavy for CI); fixture provenance + reproduction steps are in
  # tests/fixtures/README.md.
  fixture-integrity:
    name: Fixture Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify fixtures decode via CLI
        run: |
          cargo build --locked
          ./target/debug/sorob-inspect validate tests/fixtures/udt_contract_a.wasm --json
          ./target/debug/sorob-inspect validate tests/fixtures/udt_contract_b.wasm --json
          ./target/debug/sorob-inspect diff tests/fixtures/udt_contract_a.wasm tests/fixtures/udt_contract_b.wasm --json
          ./target/debug/sorob-inspect diff tests/fixtures/udt_contract_c.wasm tests/fixtures/udt_contract_d.wasm --json
          ./target/debug/sorob-inspect diff tests/fixtures/udt_contract_e.wasm tests/fixtures/udt_contract_f.wasm --json
          ./target/debug/sorob-inspect validate tests/fixtures/event_formats.wasm --json
      - name: Verify fixture sizes are stable
        run: |
          test $(stat -c%s tests/fixtures/udt_contract_a.wasm) -eq 3914
          test $(stat -c%s tests/fixtures/udt_contract_b.wasm) -eq 2658
          test $(stat -c%s tests/fixtures/udt_contract_c.wasm) -eq 1493
          test $(stat -c%s tests/fixtures/udt_contract_d.wasm) -eq 1521
          test $(stat -c%s tests/fixtures/udt_contract_e.wasm) -eq 576
          test $(stat -c%s tests/fixtures/udt_contract_f.wasm) -eq 577
          test $(stat -c%s tests/fixtures/event_formats.wasm) -eq 1393
